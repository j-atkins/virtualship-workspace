name: Test Binder Notebook Links

on:
  push:
    branches: [ main ]
    paths:
      - '.binder/files_to_fetch.txt'
  pull_request:
    branches: [ main ]
    paths:
      - '.binder/files_to_fetch.txt'
  schedule:
    # run every Monday at 08:00 UTC to catch stale links automatically
    - cron: '0 8 * * 1'
  workflow_dispatch: # allow manual triggering from the GitHub Actions tab

jobs:
  test-notebook-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run notebook URL unit tests
        run: |
          pytest tests/test_binder_files.py -v